name: voice_to_file_app
description: App Flutter per trascrivere da microfono e salvare in TXT o PDF
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  pdf: ^3.11.1
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
