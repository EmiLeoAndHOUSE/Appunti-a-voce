name: Compila APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il codice (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Configura Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configura Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Setup Scaffolding Android e Gradle Wrapper
        run: |
          mkdir -p /tmp/backup
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          flutter create --platforms=android --org com.example .
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew || true

      - name: 📦 Scarica pacchetti dipendenze
        run: flutter pub get

      - name: 🔨 Compila APK Release
        run: flutter build apk --release

      - name: 🚀 Carica APK generato come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-to-file-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
