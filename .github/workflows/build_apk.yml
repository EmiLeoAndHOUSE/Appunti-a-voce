name: Compila APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il codice (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Configura Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configura Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Genera scaffolding Android ufficiale
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              data = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\"/>
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>
              <queries>
                  <intent>
                      <action android:name=\"android.speech.RecognitionService\" />
                  </intent>
              </queries>
          '''
          data = data.replace('<application', perms + '\n    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(data)
          "

      - name: 📦 Scarica pacchetti dipendenze
        run: flutter pub get

      - name: 🔨 Compila APK Release
        run: flutter build apk --release

      - name: 🚀 Carica APK generato come Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-to-file-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
